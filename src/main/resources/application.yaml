server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: bori

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:bori}
    username: ${DB_USERNAME:bori}
    password: ${DB_PASSWORD:bori}

  # 스키마는 Flyway(db/migration)가 만든다. Hibernate는 엔티티와 맞는지 검증만 한다.
  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
    show-sql: ${SHOW_SQL:true}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# 관리자 계정 시드. 이메일·비밀번호가 둘 다 있고 그 이메일이 없을 때만 만든다.
bori:
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:관리자}
