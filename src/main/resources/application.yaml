server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: bori

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:bori}
    username: ${DB_USERNAME:bori}
    password: ${DB_PASSWORD:bori}

  # 스키마는 Flyway(db/migration)가 만든다. Hibernate는 엔티티와 맞는지 검증만 한다.
  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
    show-sql: ${SHOW_SQL:true}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# 모델 저장소 zip을 받을 곳. 테스트할 때 로컬 서버로 바꿀 수 있다.
bori:
  github:
    codeload-base-url: ${GITHUB_CODELOAD_BASE_URL:https://codeload.github.com}

  # 성능 지표(metric_sample) 보관 기간. 매일 04:30에 지난 샘플을 지운다.
  metric:
    retention-days: ${METRIC_RETENTION_DAYS:30}

  # 대여 보드 사진. S3_BUCKET이 없으면 사진 업로드만 꺼진다.
  # S3_ENDPOINT는 MinIO 같은 S3 호환 저장소일 때만. 자격 증명은 AWS 기본 체인(AWS_ACCESS_KEY_ID 등).
  storage:
    s3:
      bucket: ${S3_BUCKET:}
      region: ${S3_REGION:ap-northeast-2}
      endpoint: ${S3_ENDPOINT:}
      public-base-url: ${S3_PUBLIC_BASE_URL:}

  # 관리자 계정 시드. 이메일·비밀번호가 둘 다 있고 그 이메일이 없을 때만 만든다.
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:관리자}
