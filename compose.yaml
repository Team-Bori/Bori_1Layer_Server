services:
  mysql:
    image: mysql:8.0
    container_name: bori-mysql
    environment:
      MYSQL_DATABASE: bori
      MYSQL_USER: bori
      MYSQL_PASSWORD: bori
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - bori-mysql:/var/lib/mysql

volumes:
  bori-mysql:
