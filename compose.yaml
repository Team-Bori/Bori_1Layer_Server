services:
  postgres:
    image: postgres:17
    container_name: bori-postgres
    environment:
      POSTGRES_DB: bori
      POSTGRES_USER: bori
      POSTGRES_PASSWORD: bori
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - bori-postgres:/var/lib/postgresql/data

volumes:
  bori-postgres:
